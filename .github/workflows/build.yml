name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ published ]   # ao publicar um Release pelo site, anexa o APK a ele
  workflow_dispatch:   # permite disparar manualmente pela aba Actions

permissions:
  contents: write       # necessário para criar o Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlipperDroid-debug-apk
          path: build/outputs/apk/debug/*.apk

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/outputs/apk/debug/*.apk
          generate_release_notes: true

      - name: Publish v2.0.0 Release with APK (on main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: FlipperDroid v2.0.0 - Professional Red Team Edition
          files: build/outputs/apk/debug/*.apk
          body: |
            FlipperDroid v2.0.0 — Professional Red Team Edition

            New modules: BLE GATT Fuzzer, NFC Relay Attack, Packet Sniffer,
            IoT Protocol Scanner, Report Generator.

            The APK below is the debug build produced by CI (installable on
            Android 10+). For authorized security testing only.
